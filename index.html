<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pineapple — Scroll Prototype</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#eadcc4;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}#entry{position:fixed;inset:0;background:#050505;z-index:10;display:grid;place-items:center;text-align:center;padding:25px;transition:opacity .6s}#entry.out{opacity:0;pointer-events:none}.micro{font-size:10px;letter-spacing:.28em;color:#b99b69}h1{font-size:clamp(30px,8vw,60px);font-weight:200;letter-spacing:.16em}#entry p{font-size:13px;line-height:1.8;color:#aaa093;max-width:340px}button{border:1px solid #c5a269;background:none;color:#e2c18b;padding:15px 25px;letter-spacing:.2em;margin-top:20px}#runway{height:550vh}#scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,#1c170e 0%,#080807 42%,#050505 75%)}header{position:absolute;left:7%;right:7%;top:28px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.25em;color:#bda16e}#object{position:absolute;width:220px;height:360px;left:50%;top:48%;transform:translate(-50%,-50%);transform-style:preserve-3d;will-change:transform}#shell{position:absolute;left:28px;top:122px;width:164px;height:224px;border-radius:44%;background:radial-gradient(ellipse at 25% 20%,#726042,#232528 39%,#090a0b 77%);border:1px solid #9f7a45;box-shadow:inset -20px -15px 35px #000,0 0 35px #8f6b3122}#core{position:absolute;left:67px;top:165px;width:86px;height:145px;border-radius:46%;border:2px solid #d6a960;background:repeating-linear-gradient(40deg,#211b14 0 9px,#c29a55 10px 12px,#211b14 13px 22px);box-shadow:0 0 30px #a87935aa;opacity:0}#tiles{position:absolute;inset:0;transform-style:preserve-3d}.tile{position:absolute;width:40px;height:46px;clip-path:polygon(50% 0,98% 28%,88% 76%,50% 100%,12% 76%,2% 28%);background:linear-gradient(125deg,#b28b52,#151718 45%,#050607 65%,#d3a661);border:1px solid #c09a5e;box-shadow:0 0 7px #b08a4e55;will-change:transform}.tile:after{content:"";position:absolute;inset:7px;clip-path:inherit;background:linear-gradient(130deg,#5a492e,#101113 55%,#a17c43)}#leaves{position:absolute;inset:0;transform-origin:50% 44%}.leaf{position:absolute;left:100px;top:3px;width:20px;height:145px;clip-path:polygon(50% 0,100% 78%,50% 100%,0 78%);background:linear-gradient(90deg,#151618,#c09c60 50%,#18191a);transform-origin:50% 100%}#label{position:absolute;left:8%;top:55%;transform:translateY(-50%);max-width:300px}#number{font-size:10px;letter-spacing:.25em;color:#c3a16c}#title{font-weight:200;font-size:clamp(40px,6vw,80px);letter-spacing:.1em;color:#e0c18e;margin:14px 0}#detail{font-size:13px;line-height:1.7;color:#9f9587}#hint{position:absolute;right:8%;bottom:25px;font-size:10px;letter-spacing:.2em;color:#b99b69}#bar{position:absolute;right:8%;top:35%;height:23%;width:1px;background:#514330}#fill{width:2px;height:0;background:#e1b778}#floor{position:absolute;left:50%;bottom:13%;width:260px;height:20px;transform:translateX(-50%);background:#c49b53;filter:blur(28px);opacity:.28}
@media(max-width:650px){#object{top:40%}#label{top:auto;bottom:12%;transform:none;max-width:75%}#title{font-size:38px;margin:8px 0}#detail{font-size:12px}#floor{bottom:27%}#bar{top:28%}}
</style></head><body><div id="entry"><div><div class="micro">MIKE GREENE / MOTION STUDY 001</div><h1>THE PINEAPPLE</h1><p>This prototype begins after the ENTER button on your existing CH 13 screen. Your actual intro will remain unchanged.</p><button id="enter">SIMULATE ENTER →</button></div></div><div id="runway"></div><div id="scene"><header><span>MIKE GREENE.</span><span>EXPERIMENT / 001</span></header><div id="floor"></div><div id="object"><div id="shell"></div><div id="core"></div><div id="tiles"></div><div id="leaves"></div></div><div id="label"><div id="number">00 / ARRIVAL</div><h2 id="title">ARRIVAL</h2><p id="detail">Scroll to begin the disassembly.</p></div><div id="bar"><div id="fill"></div></div><div id="hint">SCROLL TO EXPLORE ↓</div></div><script>
const $=s=>document.querySelector(s),clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>x*x*(3-2*x);let tiles=[];for(let row=0;row<6;row++)for(let col=0;col<5;col++){let x=31+col*30+(row%2?12:0),y=137+row*34;if(Math.abs(x-104)>84*Math.sqrt(Math.max(0,1-((y-236)/120)**2))+.5)continue;let el=document.createElement('div');el.className='tile';el.style.left=x+'px';el.style.top=y+'px';$('#tiles').append(el);let angle=row*2.1+col*2.7;tiles.push({el,dx:Math.cos(angle)*(105+(row*9+col*7)%90),dy:Math.sin(angle)*(80+(row*8+col*13)%75),r:Math.sin(angle)*175,z:Math.cos(angle)*95})}for(let i=0;i<11;i++){let l=document.createElement('div');l.className='leaf';l.style.transform=`rotate(${(i-5)*15}deg) scaleY(${.76+(i%4)*.07})`;$('#leaves').append(l)}let chapters=[['00 / ARRIVAL','ARRIVAL','Scroll to begin the disassembly.'],['01 / ABOUT','ABOUT','Your own About section will go here.'],['02 / WORK','WORK','Your projects and professional work.'],['03 / THOUGHTS','THOUGHTS','Your writing and ideas.'],['04 / CONNECT','CONNECT','Your preferred ways to connect.']];let started=false,startTime=0;function frame(){if(!started)return;let p=clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)),explode=ease(clamp((p-.09)/.85));let f=clamp((performance.now()-startTime)/1150),fall=1-(1-f)**3,bounce=f<1?Math.sin(f*Math.PI*3)*22*(1-f):0;let mobile=innerWidth<650;$('#object').style.transform=`translate(-50%,-50%) translateY(${(1-fall)*-innerHeight*1.5+bounce}px) rotateY(${explode*24}deg) rotateZ(${-explode*7}deg) scale(${mobile?.85:1})`;$('#shell').style.opacity=1-explode*.98;$('#core').style.opacity=clamp((explode-.12)*2.4);$('#core').style.transform=`scale(${.65+explode*.55}) rotate(${explode*80}deg)`;$('#leaves').style.transform=`translate(${explode*55}px,${-explode*140}px) rotate(${explode*32}deg)`;tiles.forEach((t,i)=>{let v=ease(clamp((explode-(i%4)*.03)/.86));t.el.style.transform=`translate3d(${t.dx*v}px,${t.dy*v}px,${t.z*v}px) rotate(${t.r*v}deg) rotateY(${v*105}deg)`});let ch=chapters[Math.min(4,Math.floor(p*5+.01))];if($('#title').textContent!==ch[1]){$('#number').textContent=ch[0];$('#title').textContent=ch[1];$('#detail').textContent=ch[2]}$('#fill').style.height=p*100+'%';requestAnimationFrame(frame)}$('#enter').onclick=()=>{started=true;startTime=performance.now();$('#entry').classList.add('out');scrollTo(0,0);requestAnimationFrame(frame);setTimeout(()=>$('#entry').remove(),700)};
</script></body></html>
